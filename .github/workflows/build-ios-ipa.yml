# ============================================================================
# 小宇专属版 Folia iOS —— 云端编译未签名 IPA
# 基于官方 folia-major 0.7.29 + port.patch（直连层 + Capacitor 壳 + 品牌）
# 产物未签名：TrollStore 直接装，或 Sideloadly/AltStore 自签。
# ============================================================================
name: Build 小宇Folia IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  XCODE_PATH: /Applications/Xcode_16.4.app
  NODE_VERSION: 24

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout 官方 0.7.29 源码
        uses: actions/checkout@v4
        with:
          repository: chthollyphile/folia-major
          ref: main
          fetch-depth: 1
          path: src

      - name: 下载移植补丁
        run: |
          set -euo pipefail
          curl -sL -o port.patch "https://raw.githubusercontent.com/${{ github.repository }}/main/port.patch"
          wc -c port.patch

      - name: 应用移植补丁（git am）
        working-directory: src
        run: |
          set -euo pipefail
          git config user.email "ci@example.com"
          git config user.name "XiaoYu Build"
          # 官方主线 commit 与补丁 base 一致则可直接 am；否则用 3-way
          git am --3way ../port.patch || { echo "::error::补丁应用失败"; git am --abort 2>/dev/null || true; exit 1; }
          echo "✅ 补丁已应用"
          grep -q 'neteaseDirect' src/services/onlineMusic/web/netease.ts && echo "✅ 直连层已就位"

      - name: 环境
        run: |
          sw_vers
          xcodebuild -version

      - name: 选择 Xcode
        run: sudo xcode-select -s "$XCODE_PATH"

      - name: 安装 Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 安装 Web 依赖
        working-directory: src
        run: |
          export ELECTRON_SKIP_BINARY_DOWNLOAD=1
          export PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
          npm ci --no-audit --no-fund

      - name: 构建 Vite Web 产物
        working-directory: src
        run: npx vite build

      - name: 同步到 iOS 工程
        working-directory: src
        run: npx cap sync ios

      - name: 无签名归档
        working-directory: src
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/build/App.xcarchive"
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" CODE_SIGN_STYLE=Manual \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tail -300

      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/build/App.xcarchive"
          APP="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          [ -n "$APP" ] || { echo "::error::archive 无 .app"; exit 1; }
          mkdir -p "$RUNNER_TEMP/out/Payload"
          ditto "$APP" "$RUNNER_TEMP/out/Payload/$(basename "$APP")"
          cd "$RUNNER_TEMP/out"
          zip -qry "小宇Folia-0.7.29-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa
          if unzip -l *.ipa | grep -qE '_CodeSignature/|embedded.mobileprovision'; then
            echo "::error::含签名痕迹"; exit 1
          fi
          echo "✅ 未签名 IPA"

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaoyu-folia-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/out"
          IPA="$(ls *.ipa)"
          TAG="xiaoyu-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" "$IPA" \
            --title "小宇Folia 0.7.29 未签名 IPA" \
            --notes "官方 folia 0.7.29 + iOS 直连层（网易云本地 eapi/weapi 加密，零后端可听歌）+ 小宇品牌。未签名 IPA：TrollStore 直接导入，或 Sideloadly/AltStore + 免费 Apple ID 自签（7 天）。" \
            --latest
          echo "下载: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
